    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fdfbfe 0%, #f7f1fb 50%, #f0e6f7 100%);
            position: relative;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Animação de Partículas de Energia (Orbs) --- */
        .orb-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            will-change: transform, opacity;
            opacity: 0.5;
            animation: floatSlow 25s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(186,104,200,0.22) 0%, rgba(186,104,200,0) 70%);
            top: 10%; left: -10%;
            animation-duration: 35s;
        }

        .orb-2 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(255,213,79,0.15) 0%, rgba(255,213,79,0) 70%);
            bottom: 5%; right: -10%;
            animation-duration: 45s;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(129,212,250,0.15) 0%, rgba(129,212,250,0) 70%);
            top: 45%; left: 35%;
            animation-duration: 30s;
            animation-delay: -10s;
        }

        @keyframes floatSlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, -40px) scale(1.1); }
            100% { transform: translate(-40px, 50px) scale(0.95); }
        }

        /* --- Animação do Pulso do Reiki --- */
        @keyframes reikiPulse {
            0% { box-shadow: 0 0 0 0 rgba(224, 64, 251, 0.4), 0 4px 15px rgba(224, 64, 251, 0.15); }
            70% { box-shadow: 0 0 0 12px rgba(224, 64, 251, 0), 0 4px 15px rgba(224, 64, 251, 0.15); }
            100% { box-shadow: 0 0 0 0 rgba(224, 64, 251, 0), 0 4px 15px rgba(224, 64, 251, 0.15); }
        }
        .btn-reiki-pulse {
            animation: reikiPulse 2.5s infinite;
        }

        /* Estilo dos créditos */
        .dev-credit {
            display: inline-block;
            margin-top: 16px;
            font-size: 0.75rem;
            color: rgba(103, 58, 183, 0.6);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .dev-credit:hover {
            color: rgba(103, 58, 183, 0.9);
        }

        /* Garante que o conteúdo fique na frente dos orbs */
        main {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
